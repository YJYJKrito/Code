#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="290" y="437.25" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">是</text><path d="M280,370.0 L280,494.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="290" y="437.25" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">是</text><path d="M130.0,517.0 L88,517.0 L88,347.5 L160.0,347.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M400.0,404.0 L470,404.0 L470,460.5 L445.0,460.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="410.0" y="395.0" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">否</text><path d="M280,483.0 L280,494.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M555,483.0 L555,517.0 L430.0,517.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="725.0" y="325.0" width="250" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="850" y="353.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">rest = 非空那条链的表头</text><path d="M400.0,347.5 L725.0,347.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="410.0" y="338.5" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">否</text><polygon points="850,415.0 975.0,437.5 850,460.0 725.0,437.5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="850" y="443.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">rest != NULL ?</text><path d="M850,369.5 L850,403.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="725.0" y="505.0" width="250" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="850" y="533.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">p = rest，rest = r