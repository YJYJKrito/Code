<svg xmlns="http://www.w3.org/2000/svg" width="860" height="631" viewBox="0 0 860 631"><rect width="860" height="631" fill="#fff"/><defs><marker id="ar" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker></defs><rect x="215.0" y="23.5" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="280" y="51.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">开始</text><polygon points="166.0,80.0 410.0,80.0 394.0,125.0 150.0,125.0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="108.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">输入表达式 expr</text><rect x="130.0" y="127.0" width="300" height="64" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="155.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">初始化操作数栈 num</text><text x="280" y="174.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">和运算符栈 op</text><rect x="180.0" y="202.5" width="200" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="230.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">取当前字符 c</text><polygon points="280,259.0 400.0,281.5 280,304.0 160.0,281.5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="287.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">c == &#x27;\0&#x27; ?</text><rect x="110.0" y="296.5" width="340" height="83" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="324.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">数字 → 压入 num；&#x27;(&#x27; → 压入 op</text><text x="280" y="343.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">&#x27;)&#x27; → 弹出运算符并计算，直到 &#x27;(&#x27;</text><text x="280" y="362.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">其他 → 按优先级弹出并计算后入栈</text><rect x="120.0" y="391.0" width="320" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="419.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">弹出 op 中剩余的运算符并计算</text><polygon points="280,447.5 430.0,470.0 280,492.5 130.0,470.0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="475.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">出现括号不匹配或除数为 0 ?</text><polygon points="541.0,447.5 775.0,447.5 759.0,492.5 525.0,492.5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="650" y="475.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">输出表达式错误</text><path d="M430.0,470.0 L525.0,470.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="440.0" y="461.0" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">是</text><rect x="585.0" y="526.0" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="650" y="554.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">结束</text><path d="M650,492.5 L650,526.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><polygon points="176.0,504.0 400.0,504.0 384.0,549.0 160.0,549.0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="532.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">输出计算结果</text><rect x="215.0" y="560.5" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="280" y="588.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">结束</text><path d="M280,68.5 L280,80.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d=