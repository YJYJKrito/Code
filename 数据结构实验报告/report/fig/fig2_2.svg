<svg xmlns="http://www.w3.org/2000/svg" width="860" height="612" viewBox="0 0 860 612"><rect width="860" height="612" fill="#fff"/><defs><marker id="ar" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker></defs><rect x="215.0" y="23.5" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="280" y="51.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">开始</text><polygon points="196.0,80.0 380.0,80.0 364.0,125.0 180.0,125.0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="108.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">输入 k</text><polygon points="280,136.5 390.0,159.0 280,181.5 170.0,159.0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="164.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">k &gt;= 2 ?</text><polygon points="541.0,136.5 775.0,136.5 759.0,181.5 525.0,181.5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="650" y="164.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">输出“k必须大于等于2”</text><path d="M390.0,159.0 L525.0,159.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="400.0" y="150.0" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">否</text><rect x="585.0" y="215.0" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="650" y="243.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">结束</text><path d="M650,181.5 L650,215.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="130.0" y="193.0" width="300" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="221.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">队列清空，依次入队 1、1</text><rect x="190.0" y="249.5" width="180" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="277.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">level = 2</text><polygon points="280,306.0 400.0,328.5 280,351.0 160.0,328.5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="334.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">level &lt;= k ?</text><rect x="110.0" y="353.0" width="340" height="64" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="381.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">重复 level-1 次：</text><text x="280" y="400.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">出队 a，取队头 b，入队 a+b</text><rect x="160.0" y="428.5" width="240" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="456.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">入队 1，level++</text><polygon points="146.0,485.0 430.0,485.0 414.0,530.0 130.0,530.0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="513.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">依次出队并输出各项系数</text><rect x="215.0" y="541.5" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="280" y="569.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">结束</text><path d="M280,68.5 L280,80.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,125.0 L280,136.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,181.5 L280,193.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,238.0 L280,249.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,294.5 L28