<svg xmlns="http://www.w3.org/2000/svg" width="880" height="612" viewBox="0 0 880 612"><rect width="880" height="612" fill="#fff"/><defs><marker id="ar" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker></defs><rect x="215.0" y="23.5" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="280" y="51.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">开始</text><polygon points="136.0,80.0 440.0,80.0 424.0,125.0 120.0,125.0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="108.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">输入主串 str 和子串 substr</text><rect x="130.0" y="136.5" width="300" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="164.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">求长度 n、m，令 pos = 0</text><polygon points="280,193.0 410.0,215.5 280,238.0 150.0,215.5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="221.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">m == 0 或 m &gt; n ?</text><polygon points="541.0,193.0 775.0,193.0 759.0,238.0 525.0,238.0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="650" y="221.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">输出“不存在”</text><path d="M410.0,215.5 L525.0,215.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="420.0" y="206.5" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">是</text><rect x="585.0" y="271.5" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="650" y="299.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">结束</text><path d="M650,238.0 L650,272.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="210.0" y="249.5" width="140" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="277.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">i = 0</text><polygon points="280,306.0 400.0,328.5 280,351.0 160.0,328.5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="334.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">i &lt;= n - m ?</text><rect x="110.0" y="353.0" width="340" height="64" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="381.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">从 i 开始逐字符比较，</text><text x="280" y="400.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">若 m 个字符全部相等，则 pos = i+1</text><rect x="210.0" y="428.5" width="140" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="456.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">i++</text><polygon points="106.0,485.0 470.0,485.0 454.0,530.0 90.0,530.0" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="513.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">输出 pos（pos 为 0 表示不存在）</text><rect x="215.0" y="541.5" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="280" y="569.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">结束</text><path d="M280,68.5 L280,80.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,125.0 L280,136.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,181.5 L280,193.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,238.0 L280,249.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,294.5 L280,306.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,238.0 L280,249.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="290" y="248.75" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">否</text><path d="M280,351.0 L280,353.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="290" y="357.0" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">是</text><path d="M280,417.0 L280,428.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M210.0,451.0 L60,451.0 L60,328.5 L160.0,328.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M400.0,328.5 L490,328.5 L490,479.25 L280,479.25 L280,485.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="410.0" y="319.5" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">否</text><path d="M280,530.0 L280,541.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/></svg>