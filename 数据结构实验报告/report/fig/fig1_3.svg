<svg xmlns="http://www.w3.org/2000/svg" width="830" height="377" viewBox="0 0 830 377"><rect width="830" height="377" fill="#fff"/><defs><marker id="ar" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#000"/></marker></defs><rect x="160.0" y="23.5" width="240" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="280" y="51.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">Average(head, n)</text><polygon points="280,80.0 400.0,102.5 280,125.0 160.0,102.5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="108.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">head == NULL ?</text><polygon points="541.0,70.5 775.0,70.5 759.0,134.5 525.0,134.5" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="650" y="98.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">n = 0</text><text x="650" y="117.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">返回 0</text><path d="M400.0,102.5 L525.0,102.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="410.0" y="93.5" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">是</text><rect x="585.0" y="168.0" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="650" y="196.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">结束</text><path d="M650,134.5 L650,168.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><rect x="110.0" y="136.5" width="340" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="164.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">avg = Average(head-&gt;next, n)</text><rect x="200.0" y="193.0" width="160" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="221.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">n++</text><rect x="85.0" y="249.5" width="390" height="45" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="280" y="277.5" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">返回 (avg×(n-1) + head-&gt;data) / n</text><rect x="215.0" y="306.0" width="130" height="45" rx="22.5" ry="22.5" fill="#EDEDED" stroke="#000" stroke-width="1.4"/><text x="280" y="334.0" font-family="SimSun, SimHei, sans-serif" font-size="15" text-anchor="middle" fill="#000">结束</text><path d="M280,68.5 L280,80.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,125.0 L280,136.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><text x="290" y="135.75" font-family="SimSun, SimHei, sans-serif" font-size="13" text-anchor="start" fill="#000">否</text><path d="M280,181.5 L280,193.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,238.0 L280,249.5" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/><path d="M280,294.5 L280,306.0" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#ar)"/></svg>